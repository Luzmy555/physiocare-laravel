<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="600" fill="#eef2f7"/>
  <rect width="960" height="36" fill="#e2e8f0"/>
  <circle cx="18" cy="18" r="5" fill="#f87171"/><circle cx="36" cy="18" r="5" fill="#fbbf24"/><circle cx="54" cy="18" r="5" fill="#34d399"/>
  <rect x="90" y="8" width="500" height="20" rx="10" fill="#ffffff"/>
  <text x="105" y="22" font-size="11" fill="#64748b">fisiocarealya.com/agendar-cita</text>

  <rect x="0" y="36" width="960" height="56" fill="#0f172a"/>
  <text x="32" y="70" font-size="20" fill="#ffffff" font-weight="bold">FisioCare Ayla</text>

  <text x="48" y="130" font-size="24" fill="#0f172a" font-weight="bold">Agenda tu cita en línea</text>
  <text x="48" y="152" font-size="13" fill="#64748b">Elige especialidad, fisioterapeuta y el horario que prefieras</text>

  <!-- step indicator -->
  <g font-size="12">
    <circle cx="70" cy="185" r="14" fill="#0066cc"/><text x="65" y="190" fill="#fff" font-weight="bold">1</text>
    <text x="92" y="190" fill="#0066cc" font-weight="bold">Especialidad</text>
    <line x1="220" y1="185" x2="290" y2="185" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="310" cy="185" r="14" fill="#0066cc"/><text x="305" y="190" fill="#fff" font-weight="bold">2</text>
    <text x="332" y="190" fill="#0066cc" font-weight="bold">Fisioterapeuta</text>
    <line x1="460" y1="185" x2="530" y2="185" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="550" cy="185" r="14" fill="#cbd5e1"/><text x="545" y="190" fill="#334155" font-weight="bold">3</text>
    <text x="572" y="190" fill="#64748b">Fecha y hora</text>
    <line x1="670" y1="185" x2="740" y2="185" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="760" cy="185" r="14" fill="#cbd5e1"/><text x="755" y="190" fill="#334155" font-weight="bold">4</text>
    <text x="782" y="190" fill="#64748b">Tus datos</text>
  </g>

  <!-- form card -->
  <rect x="48" y="220" width="864" height="330" rx="14" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="80" y="260" font-size="12" fill="#334155" font-weight="bold">Especialidad</text>
  <rect x="80" y="270" width="380" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="96" y="295" font-size="12" fill="#0f172a">Fisioterapia Deportiva</text>

  <text x="500" y="260" font-size="12" fill="#334155" font-weight="bold">Fisioterapeuta</text>
  <rect x="500" y="270" width="380" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="516" y="295" font-size="12" fill="#0f172a">Juan García — disponible desde 08:00</text>

  <text x="80" y="340" font-size="12" fill="#334155" font-weight="bold">Fecha</text>
  <rect x="80" y="350" width="180" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="96" y="375" font-size="12" fill="#0f172a">29/07/2026</text>

  <text x="280" y="340" font-size="12" fill="#334155" font-weight="bold">Hora disponible</text>
  <g font-size="11" fill="#0066cc">
    <rect x="280" y="350" width="70" height="34" rx="8" fill="#dbeafe"/><text x="298" y="371">09:00</text>
    <rect x="360" y="350" width="70" height="34" rx="8" fill="#dbeafe"/><text x="378" y="371">10:30</text>
    <rect x="440" y="350" width="70" height="34" rx="8" fill="#0066cc"/><text x="456" y="371" fill="#fff">13:00</text>
    <rect x="520" y="350" width="70" height="34" rx="8" fill="#dbeafe"/><text x="538" y="371">15:30</text>
  </g>
  <text x="80" y="420" font-size="11" fill="#64748b">Los horarios se calculan en tiempo real según la agenda del fisioterapeuta seleccionado.</text>

  <rect x="80" y="460" width="380" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="96" y="485" font-size="12" fill="#94a3b8">Motivo de la consulta</text>

  <rect x="720" y="480" width="160" height="42" rx="21" fill="#0066cc"/>
  <text x="748" y="506" font-size="13" fill="#fff" font-weight="bold">Confirmar cita</text>
</svg>
